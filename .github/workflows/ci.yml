name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # has Docker, which the integration tests need (Redis + Valkey containers)
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # dev tooling (vitest, testcontainers) needs Node >= 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run docs # fails on broken doc links, so docs can't rot
