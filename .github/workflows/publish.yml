name: Publish

# Push a tag matching package.json's version (e.g. `npm version patch && git push --follow-tags`).
# Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret. Configure the trusted publisher on
# npmjs.com -> dsemaphore -> Settings: owner 07prajwal2000, repo dsemaphore, workflow publish.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm exchange the GitHub OIDC token for publish rights (and signs provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, required for trusted publishing
          cache: npm
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm publish
